[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "slotgen-provider"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
art = ["Pillow>=10", "numpy>=1.24", "scipy>=1.10", "opencv-python>=4.8"]

[tool.setuptools]
license-files = ["licenses/*.txt", "THIRD_PARTY_NOTICES.md"]

[tool.setuptools.packages.find]
where = ["src"]
